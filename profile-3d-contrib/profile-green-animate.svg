<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Naveed's animated 3D engineering activity visual</title>
<desc id="desc">An animated isometric matrix representing growth across AI, machine learning and software engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#082f49"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<g opacity=".18" stroke="#67e8f9"><path d="M0 300L300 0M180 360L540 0M420 360L780 0M660 360L1020 0M900 360L1200 60"/><path d="M0 80H1200M0 150H1200M0 220H1200M0 290H1200"/></g>
<g transform="translate(600 58)" text-anchor="middle" fill="#e0f2fe" font-family="Arial,Helvetica,sans-serif">
 <text font-size="27" font-weight="700">NAVEED • BUILDING INTELLIGENT SYSTEMS</text>
 <text y="30" font-size="13" fill="#bae6fd">AI  ·  ML  ·  DATA  ·  VISION  ·  NLP  ·  GENAI  ·  AGENTS</text>
</g>
<g transform="translate(170 118)" stroke="#67e8f9" stroke-width="1.2">
 <g id="base" fill="url(#cell)" filter="url(#glow)" opacity=".88">
  <path d="M0 120l34-20 34 20-34 20zM0 80l34-20 34 20-34 20zM0 40l34-20 34 20-34 20z"/>
  <path d="M80 120l34-20 34 20-34 20zM80 80l34-20 34 20-34 20zM80 40l34-20 34 20-34 20zM80 0l34-20 34 20-34 20z"/>
  <path d="M160 120l34-20 34 20-34 20zM160 80l34-20 34 20-34 20zM160 40l34-20 34 20-34 20zM160 0l34-20 34 20-34 20z"/>
  <path d="M240 120l34-20 34 20-34 20zM240 80l34-20 34 20-34 20zM240 40l34-20 34 20-34 20z"/>
  <path d="M320 120l34-20 34 20-34 20zM320 80l34-20 34 20-34 20zM320 40l34-20 34 20-34 20zM320 0l34-20 34 20-34 20z"/>
  <path d="M400 120l34-20 34 20-34 20zM400 80l34-20 34 20-34 20zM400 40l34-20 34 20-34 20z"/>
  <path d="M480 120l34-20 34 20-34 20zM480 80l34-20 34 20-34 20zM480 40l34-20 34 20-34 20zM480 0l34-20 34 20-34 20z"/>
  <path d="M560 120l34-20 34 20-34 20zM560 80l34-20 34 20-34 20zM560 40l34-20 34 20-34 20z"/>
  <path d="M640 120l34-20 34 20-34 20zM640 80l34-20 34 20-34 20zM640 40l34-20 34 20-34 20zM640 0l34-20 34 20-34 20z"/>
 </g>
 <g fill="none" stroke="#a5f3fc" opacity=".65"><path d="M0 120l34 20 34-20M80 120l34 20 34-20M160 120l34 20 34-20M240 120l34 20 34-20M320 120l34 20 34-20M400 120l34 20 34-20M480 120l34 20 34-20M560 120l34 20 34-20M640 120l34 20 34-20"/></g>
</g>
<g fill="#bae6fd" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
 <text x="240" y="325">DATA</text><text x="350" y="325">ML</text><text x="470" y="325">VISION</text><text x="590" y="325">NLP</text><text x="710" y="325">GENAI</text><text x="830" y="325">RAG</text><text x="950" y="325">AGENTS</text>
</g>
<circle cx="170" cy="112" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="150" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>